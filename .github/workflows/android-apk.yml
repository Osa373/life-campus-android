name: Build and publish Life Campus Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER" || { echo "Android SDK manager not found"; exit 1; }
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk life-campus-v0.2.0-test.apk
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeCampus-Android-v0.2.0-Test-APK
          path: life-campus-v0.2.0-test.apk
          if-no-files-found: error
      - name: Publish beta test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0-beta >/dev/null 2>&1; then
            gh release upload v0.2.0-beta life-campus-v0.2.0-test.apk --clobber
          else
            gh release create v0.2.0-beta life-campus-v0.2.0-test.apk --target "$GITHUB_SHA" --title "v0.2.0 Beta — Sound alarms & reminders" --prerelease --notes "Beta test: Native scheduled reminders with notification sound. Manual exact alarms; tasks at 09:00 on due date; lectures 15 minutes before start (next 4 weeks); focus timer completion. Grant notification permission. Automatic reminders are approximate; OEM background restrictions may affect them. Existing debug-signed installations need uninstall/reinstall because each CI runner has a different debug signing key; export Life Campus data before uninstalling. Do not use as final production distribution."
          fi
