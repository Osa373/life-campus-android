plugins {
    id 'com.android.application'
}

android {
    namespace 'sa.osa373.lifecampus'
    compileSdk 35

    defaultConfig {
        applicationId 'sa.osa373.lifecampus'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '0.2.1'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
